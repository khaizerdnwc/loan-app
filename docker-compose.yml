# The whole stack locally from the production images (host-neutral demo / deploy rehearsal).
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up --build
#   backoffice http://localhost:8100  ·  API http://localhost:8101/health
# Synthetic data only; the database password below is a local placeholder, not a secret.
services:
  db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: loan_local
      POSTGRES_DB: loan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan -d loan"]
      interval: 2s
      retries: 30
  api:
    build: { context: ., target: api }
    environment:
      DATABASE_URL: postgres://loan:loan_local@db:5432/loan
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ characters)}
      CORS_ORIGIN: http://localhost:8100
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8101:3101"]
  web:
    build: { context: ., target: web }
    environment:
      API_URL: http://api:3101
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:8100:3100"]
